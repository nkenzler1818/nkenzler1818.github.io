name: Generate RSS Feed

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-content.json'
      - 'scripts/generate-rss.js'
      - '.github/workflows/generate-rss.yml'

jobs:
  generate-rss:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate RSS feed
        run: node scripts/generate-rss.js

      - name: Commit and push RSS feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet rss.xml; then
            echo "No changes to RSS feed"
          else
            git add rss.xml
            git commit -m "chore: auto-generate RSS feed [skip ci]"
            git push
          fi
